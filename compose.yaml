# Incremento I0: três processos e nada mais.
# db — PostgreSQL; api — FastAPI; web — Next.js.

name: kaivita-produtor-academico

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaivita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaivita_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kaivita}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      # Dentro da rede, o Postgres escuta sempre em 5432.
      # POSTGRES_PORT é só a porta publicada no anfitrião (ex.: 5435:5432).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kaivita}:${POSTGRES_PASSWORD:-kaivita_dev}@db:5432/${POSTGRES_DB:-kaivita}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env. Veja .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1800}
      JWT_ISSUER: ${JWT_ISSUER:-kaivita-produtor-academico}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
